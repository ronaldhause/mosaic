[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"pipeline/tests/**" = ["E402"]  # test files use importlib.util after path setup

[tool.pytest.ini_options]
testpaths = ["pipeline/tests/python"]
